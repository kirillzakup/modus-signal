<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#082742">
<meta name="description" content="МОДУС · СИГНАЛ — единое пространство для обращений, совместной работы и подтверждённых решений компании.">
<title>МОДУС · СИГНАЛ — от обращения к решению</title>
<style>
:root{
  --red:#E40000; --red-2:#ED1111; --red-soft:#FDECEC;
  --navy:#082742; --navy-2:#0F3557; --ink:#323A47; --ink-2:#2C333F;
  --grey:#747C89; --grey-2:#64748D; --line:#E4E6EA; --bg:#F3F3F3; --card:#FFFFFF;
  --green:#1E9E5A; --green-soft:#E6F6EE; --amber:#C77A00; --amber-soft:#FFF4DE;
  --blue:#2F80ED; --blue-soft:#EAF2FE; --navy-soft:#E8EDF3;
  --r-lg:24px; --r:16px; --r-sm:10px;
  --shadow:0 1px 2px rgba(8,39,66,.04),0 8px 24px rgba(8,39,66,.06);
  --font:'Gilroy','Montserrat','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--bg);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.app{display:grid;grid-template-columns:264px 1fr;min-height:100vh}
/* ── Sidebar ── */
.side{background:var(--navy);color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;text-decoration:none}
.brand .wm{font-weight:800;letter-spacing:.02em;line-height:1;font-size:17px}
.brand .wm small{display:block;color:var(--red-2);font-size:17px;margin-top:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:#C9D3DF;text-decoration:none;font-weight:600;font-size:14.5px}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:#fff;color:var(--navy)}
.nav a .ic{width:20px;text-align:center;opacity:.9}
.nav a .cnt{margin-left:auto;background:var(--red);color:#fff;border-radius:99px;font-size:11.5px;padding:1px 8px}
.nav .sep{height:1px;background:rgba(255,255,255,.1);margin:10px 8px}
.side .foot{margin-top:auto;font-size:12px;color:#8FA0B4;padding:10px 8px;line-height:1.5}
.dots{background-image:radial-gradient(var(--red) 2.2px,transparent 2.6px);background-size:14px 14px}
/* ── Top ── */
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:16px 28px;background:rgba(243,243,243,.9);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20}
.search{flex:1;max-width:520px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:99px;padding:11px 16px 11px 40px;outline:none}
.search input:focus{border-color:var(--navy)}
.search .ic{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--grey)}
.top .sp{flex:1}
.who{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 12px 5px 5px;cursor:pointer;max-width:330px}
.who select{border:0;background:transparent;outline:none;font-weight:600;max-width:240px;cursor:pointer}
.ava{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12.5px;color:#fff;background:var(--navy);flex:none}
.ava.emp{background:var(--grey-2)} .ava.mgr{background:var(--navy)} .ava.adm{background:var(--red)}
.iconbtn{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;font-size:17px}
.iconbtn .dot{position:absolute;top:6px;right:6px;min-width:17px;height:17px;border-radius:99px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.view{padding:6px 28px 60px;max-width:1320px;width:100%}
/* ── Common ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:11px 18px;font-weight:700;border:1.5px solid transparent;cursor:pointer;text-decoration:none;white-space:nowrap;font-size:14.5px;transition:transform .05s}
.btn:active{transform:translateY(1px)}
.btn.red{background:var(--red);color:#fff}.btn.red:hover{background:#C90000}
.btn.navy{background:var(--navy);color:#fff}
.btn.ghost{background:#fff;border-color:var(--red);color:var(--ink)}
.btn.line{background:#fff;border-color:var(--line);color:var(--ink)}
.btn.line:hover{border-color:var(--navy)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
h1{font-size:30px;line-height:1.15;margin:8px 0 4px;color:var(--navy);font-weight:800;letter-spacing:-.01em}
h2{font-size:19px;margin:0 0 12px;color:var(--navy);font-weight:800}
h3{font-size:15.5px;margin:0 0 8px;color:var(--navy);font-weight:700}
.eyebrow{color:var(--red);font-weight:700;font-size:14px}
.muted{color:var(--grey)} .small{font-size:13px}
.card{background:var(--card);border-radius:var(--r-lg);padding:22px;box-shadow:var(--shadow)}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:10px 0 20px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.t-blue{background:var(--blue-soft);color:var(--blue)}.t-navy{background:var(--navy-soft);color:var(--navy)}
.t-amber{background:var(--amber-soft);color:var(--amber)}.t-red{background:var(--red-soft);color:var(--red)}
.t-green{background:var(--green-soft);color:var(--green)}.t-grey{background:#EEF0F2;color:var(--grey-2)}
.tag{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:12.5px;color:var(--grey-2);background:#fff;white-space:nowrap}
.tag.type-problem{border-color:#F6C9C9;color:#B30000;background:#FFF7F7}
.tag.type-idea{border-color:#CFDDF0;color:var(--navy);background:#F6F9FD}
.tag.type-praise{border-color:#C9EBD8;color:var(--green);background:#F4FBF7}
.sla{font-size:12.5px;font-weight:700;display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.sla.bad{color:var(--red)} .sla.ok{color:var(--grey-2)} .sla.warn{color:var(--amber)}
.kpi{background:#fff;border-radius:var(--r-lg);padding:18px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .v{font-size:32px;font-weight:800;color:var(--navy);line-height:1.1}
.kpi .l{color:var(--grey);font-size:13px;font-weight:600;margin-top:4px}
.kpi.alert .v{color:var(--red)}
.kpi .hint{font-size:12px;color:var(--grey);margin-top:6px}
/* hero */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
.hero .lead{background:#fff;border-radius:var(--r-lg);padding:28px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero .lead h1{font-size:34px;text-transform:uppercase;letter-spacing:.01em}
.hero .lead p{max-width:520px;color:var(--ink)}
.hero .art{border-radius:var(--r-lg) var(--r-lg) var(--r-lg) 90px;background:linear-gradient(135deg,var(--navy),#123F66);color:#fff;padding:26px;position:relative;overflow:hidden;min-height:220px}
.hero .art .dots{position:absolute;right:16px;bottom:16px;width:72px;height:72px}
.ring{position:absolute;right:-40px;top:-40px;width:200px;height:200px;border-radius:50%;border:26px solid rgba(255,255,255,.07)}
.lvl{height:8px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden;margin:10px 0 6px}
.lvl i{display:block;height:100%;background:var(--red);border-radius:99px}
/* list items */
.tl{display:flex;flex-direction:column;gap:10px}
.ti{background:#fff;border-radius:var(--r);padding:15px 18px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;gap:6px 16px;cursor:pointer;border:1.5px solid transparent;text-decoration:none}
.ti:hover{border-color:#D5DBE3}
.ti .ttl{font-weight:700;color:var(--navy);font-size:15.5px}
.ti .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--grey)}
.ti .right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.ti.over{border-left:4px solid var(--red)}
.id{font-weight:800;color:var(--grey-2);font-size:12.5px;letter-spacing:.02em}
.votes{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:12.5px;color:var(--navy);background:var(--navy-soft);border-radius:99px;padding:2px 9px}
/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 13px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.red.on{background:var(--red);border-color:var(--red)}
.sel{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:13.5px;max-width:230px}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:9px;font-weight:700;font-size:13px;cursor:pointer;color:var(--grey-2)}
.seg button.on{background:var(--navy);color:#fff}
/* kanban */
.kan{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:#E9EBEE;border-radius:var(--r);padding:10px;min-height:200px}
.col h4{margin:4px 6px 10px;font-size:13.5px;display:flex;justify-content:space-between;color:var(--navy)}
.kc{background:#fff;border-radius:12px;padding:11px 12px;margin-bottom:8px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.05);border-left:3px solid transparent}
.kc.over{border-left-color:var(--red)}
.kc .t{font-weight:700;font-size:13.5px;color:var(--navy);margin:3px 0 6px}
/* forms */
label.f{display:block;font-weight:700;font-size:13.5px;color:var(--navy);margin:0 0 6px}
.inp,textarea.inp,select.inp{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff;outline:none;font-size:15px}
.inp:focus{border-color:var(--navy)}
textarea.inp{min-height:92px;resize:vertical}
.help{font-size:12.5px;color:var(--grey);margin-top:5px}
.field{margin-bottom:16px}
.req::after{content:' *';color:var(--red)}
.typecards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tc{border:2px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;background:#fff}
.tc.on{border-color:var(--red);background:#FFF9F9}
.tc .big{font-size:22px;margin-bottom:6px}
.tc b{display:block;color:var(--navy)}
.catgrid{display:flex;flex-wrap:wrap;gap:8px}
.switch{display:flex;gap:12px;align-items:flex-start;cursor:pointer;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff}
.switch input{width:18px;height:18px;margin-top:2px;accent-color:var(--red)}
.steps{display:flex;gap:8px;margin-bottom:18px}
.steps div{flex:1;height:5px;border-radius:99px;background:var(--line)}
.steps div.on{background:var(--red)}
.routebox{background:var(--navy);color:#fff;border-radius:var(--r);padding:16px 18px}
.routebox .k{color:#9FB2C6;font-size:12.5px}
.simbox{border:1.5px dashed #F2B3B3;background:#FFF8F8;border-radius:var(--r);padding:14px 16px}
.files{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
/* ticket page */
.tp{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.path{display:flex;align-items:flex-start;gap:0;margin:16px 0 4px}
.path .st{flex:1;text-align:center;font-size:12px;font-weight:700;color:var(--grey);position:relative}
.path .st .c{width:28px;height:28px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;background:#EEF0F2;color:var(--grey);font-size:13px;position:relative;z-index:1}
.path .st::before{content:'';position:absolute;top:14px;left:-50%;width:100%;height:3px;background:#EEF0F2}
.path .st:first-child::before{display:none}
.path .st.done .c{background:var(--navy);color:#fff}.path .st.done::before{background:var(--navy)}
.path .st.cur .c{background:var(--red);color:#fff;box-shadow:0 0 0 5px var(--red-soft)}.path .st.cur{color:var(--navy)}
.path .st.cur::before{background:var(--navy)}
.path .st.warn .c{background:var(--amber);color:#fff;box-shadow:0 0 0 5px var(--amber-soft)}
.path .st.stop .c{background:var(--grey-2);color:#fff}
.block{border-radius:var(--r);padding:14px 16px;margin-top:12px}
.block.sol{background:#F6F9FD;border:1px solid #DCE6F3}
.block.res{background:var(--green-soft);border:1px solid #C6E9D6}
.block.rej{background:#F1F2F4;border:1px solid #E1E4E8}
.block.cl{background:var(--amber-soft);border:1px solid #F3DDAE}
.block .lab{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;color:var(--grey-2)}
.impact{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
.impact .b{background:#fff;border-radius:10px;padding:8px 12px;font-weight:800;color:var(--navy)}
.hist{position:relative;margin-top:6px}
.ev{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:10px 0}
.ev .mk{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:14px;background:#EEF0F2;color:var(--grey-2)}
.ev.status .mk{background:var(--navy-soft);color:var(--navy)}
.ev.escalated .mk{background:var(--red-soft);color:var(--red)}
.ev.decision .mk,.ev.verify .mk{background:var(--green-soft)}.ev.option .mk{background:var(--amber-soft)}.ev.plan .mk{background:var(--navy-soft)}
.ev.comment .bubble{background:#F5F6F8;border-radius:4px 14px 14px 14px;padding:10px 13px;margin-top:4px}
.ev.internal .bubble{background:#FFF8E8;border:1px dashed #EBCB85}
.ev .hd{font-size:13px}.ev .hd b{color:var(--navy)}
.side-card{position:sticky;top:84px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;font-size:13.5px}
.kv dt{color:var(--grey)} .kv dd{margin:0;font-weight:600;text-align:right}
.acts{display:flex;flex-direction:column;gap:8px}
/* charts */
.bars .b{display:grid;grid-template-columns:170px 1fr 44px;gap:10px;align-items:center;margin:7px 0;font-size:13px}
.bars .b .tr{height:12px;background:#EEF0F2;border-radius:99px;overflow:hidden;display:flex}
.bars .b .tr i{display:block;height:100%}
.bars .b .n{font-weight:800;color:var(--navy);text-align:right}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--grey-2)}
.legend span::before{content:'';display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;color:var(--grey);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.03em;padding:8px 10px;border-bottom:1px solid var(--line)}
table.t td{padding:10px;border-bottom:1px solid #F0F1F3;vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums}
.bad{color:var(--red);font-weight:800}
/* leaderboard */
.lb{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid #F0F1F3}
.lb:last-child{border-bottom:0}
.place{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:#EEF0F2;color:var(--navy)}
.place.p1{background:var(--red);color:#fff}.place.p2{background:var(--navy);color:#fff}.place.p3{background:var(--grey-2);color:#fff}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ach .a{border-radius:var(--r);padding:14px;background:#fff;border:1.5px solid var(--line);text-align:center}
.ach .a .i{font-size:22px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;margin:0 auto 8px;background:#EEF0F2;color:var(--grey)}
.ach .a.on{border-color:#F3C2C2}.ach .a.on .i{background:var(--red);color:#fff}
.ach .a:not(.on){opacity:.6}
.reward{display:flex;flex-direction:column;gap:8px}
.reward .cost{font-size:22px;font-weight:800;color:var(--red)}
/* modal & toast */
.ov{position:fixed;inset:0;background:rgba(8,39,66,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:#fff;border-radius:var(--r-lg);padding:24px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;z-index:200;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:92vw}
.toast.err{background:var(--red)}
.panel{position:fixed;top:70px;right:24px;width:380px;max-height:70vh;overflow:auto;background:#fff;border-radius:var(--r-lg);box-shadow:0 18px 50px rgba(8,39,66,.22);z-index:90;padding:8px}
.nt{padding:11px 12px;border-radius:12px;cursor:pointer;font-size:13.5px}
.nt:hover{background:#F5F6F8}.nt.unread{background:#FFF6F6}
.nt .when{font-size:11.5px;color:var(--grey);margin-top:3px}
.empty{text-align:center;padding:40px 20px;color:var(--grey)}
.empty .e{font-size:34px;margin-bottom:8px}
.flow{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.flow .s{flex:1;min-width:150px;background:#fff;border-radius:var(--r);padding:14px;border-top:4px solid var(--navy);box-shadow:var(--shadow)}
.flow .s:nth-child(odd){border-top-color:var(--red)}
.flow .s b{color:var(--navy);display:block;margin-bottom:4px}
.demo-note{background:#FFF4DE;border:1px solid #F3DDAE;color:#7A5200;border-radius:12px;padding:10px 14px;font-size:13px;margin:0 0 16px}
.bnav{display:none}
.mtop{display:none}
/* ── Mobile / Telegram Mini App ── */
@media (max-width: 860px){
  .app{grid-template-columns:1fr}
  .side,.top{display:none}
  .mtop{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--navy);color:#fff;position:sticky;top:0;z-index:30}
  .mtop .brand{padding:0}
  .mtop .sp{flex:1}
  .mtop .iconbtn{width:38px;height:38px;background:rgba(255,255,255,.1);border-color:transparent;color:#fff}
  .view{padding:12px 14px calc(96px + var(--safe-b))}
  h1{font-size:23px}
  .hero .lead>.dots{display:none}
  .hero{grid-template-columns:1fr}.hero .lead{padding:20px}.hero .lead h1{font-size:24px}
  .g2,.g3{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,1fr)}
  .tp{grid-template-columns:1fr}.side-card{position:static}
  .typecards{grid-template-columns:1fr}
  .ti{grid-template-columns:1fr}.ti .right{flex-direction:row;align-items:center;justify-content:space-between}
  .bars .b{grid-template-columns:110px 1fr 34px}
  .path .st{font-size:10.5px;line-height:1.2;padding:0 2px}
  .kan{grid-template-columns:repeat(5,82vw)}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--safe-b));z-index:40}
  .bnav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--grey);text-decoration:none;padding:4px 0;position:relative}
  .bnav a .ic{font-size:19px}
  .bnav a.on{color:var(--navy)}

<script>
(function(){
'use strict';
var C = window.ModusCore;
var D = { TYPES:C.TYPES, STATUSES:C.STATUSES, PRIORITIES:C.PRIORITIES, ROLES:C.ROLES, POINTS:C.POINTS, LEVELS:C.LEVELS, FLOW:C.FLOW };
var LS_KEY = 'modus-signal-v5', LS_USER = 'modus-signal-user';

/* ═════════════ Утилиты ═════════════ */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(s,el){return (el||document).querySelector(s);}
function $$(s,el){return Array.prototype.slice.call((el||document).querySelectorAll(s));}
function initials(n){var p=String(n||'?').replace(/[^А-Яа-яA-Za-z ]/g,' ').trim().split(/\s+/);return ((p[0]||'?')[0]+((p[1]||'')[0]||'')).toUpperCase();}
function avaCls(r){return r==='owner'?'own':r==='admin'?'adm':r==='manager'?'mgr':'emp';}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function ago(s){var d=(Date.now()-new Date(s).getTime())/36e5;if(d<1)return Math.max(1,Math.round(d*60))+' мин назад';if(d<24)return Math.round(d)+' ч назад';var n=Math.round(d/24);return n+' '+plural(n,'день','дня','дней')+' назад';}
function plural(n,a,b,c){n=Math.abs(n)%100;var m=n%10;if(n>10&&n<20)return c;if(m>1&&m<5)return b;if(m===1)return a;return c;}
function fmt(s){return s?C.fmtDate(s):'—';}
function hoursTo(s){return (new Date(s).getTime()-Date.now())/36e5;}
function dur(h){if(h==null)return '—';if(h<1)return Math.round(h*60)+' мин';if(h<48)return (Math.round(h*10)/10)+' ч';return Math.round(h/24)+' дн';}

/* ═════════════ Слой данных: автономный режим и сервер ═════════════ */
function LocalApi(){
  var raw=lsGet(LS_KEY), st=null;
  try{st=raw?JSON.parse(raw):null;}catch(e){st=null;}
  if(!st||st.version!==1) st=C.createSeedState();
  C.ensureDefaults(st);
  C.tick(st);
  try{C.ensureDailyReport(st);}catch(e){}
  var self=this, uid=lsGet(LS_USER)||'u1';
  function save(){lsSet(LS_KEY,JSON.stringify(st));}
  function run(fn){return new Promise(function(res,rej){try{var r=fn();save();res(r);}catch(e){rej(e);}});}
  save();
  this.mode='local';
  this.setUser=function(id){uid=id;lsSet(LS_USER,id);};
  this.userId=function(){return uid;};
  this.bootstrap=function(){return run(function(){return C.bootstrap(st,uid);});};
  this.list=function(f){return run(function(){return C.listTickets(st,uid,f);});};
  this.get=function(id){return run(function(){return C.getTicket(st,uid,id);});};
  this.create=function(d){return run(function(){d.source=App.tma?'tma':'web';var t=C.createTicket(st,uid,d);return C.getTicket(st,uid,t.id);});};
  this.transition=function(id,to,o){return run(function(){C.transition(st,uid,id,to,o);return C.getTicket(st,uid,id);});};
  this.comment=function(id,text,o){return run(function(){C.addComment(st,uid,id,text,o);return C.getTicket(st,uid,id);});};
  this.assign=function(id,u){return run(function(){C.assign(st,uid,id,u);return C.getTicket(st,uid,id);});};
  this.priority=function(id,p){return run(function(){C.setPriority(st,uid,id,p);return C.getTicket(st,uid,id);});};
  this.vote=function(id){return run(function(){C.vote(st,uid,id);return C.getTicket(st,uid,id);});};
  this.similar=function(t){return run(function(){return C.findSimilar(st,t,null,uid);});};
  this.analytics=function(){return run(function(){return C.analytics(st);});};
  this.leaderboard=function(){return run(function(){return C.leaderboard(st);});};
  this.profile=function(id){return run(function(){return C.profile(st,id||uid);});};
  this.notifications=function(){return run(function(){return C.notificationsOf(st,uid);});};
  this.markRead=function(ids){return run(function(){C.markRead(st,uid,ids);});};
  this.redeem=function(rid){return run(function(){return C.redeem(st,uid,rid);});};
  this.adminCat=function(id,p){return run(function(){return C.updateCategory(st,uid,id,p);});};
  this.adminUser=function(id,p){return run(function(){return C.updateUser(st,uid,id,p);});};
  this.createUser=function(p){return run(function(){return C.createUser(st,uid,p);});};
  this.adminSettings=function(p){return run(function(){return C.updateSettings(st,uid,p);});};
  this.reset=function(){return run(function(){st=C.createSeedState();C.tick(st);});};
  this.exportRows=function(){return run(function(){return C.listTickets(st,uid,{sort:'created'});});};
  this.claim=function(id){return run(function(){C.claim(st,uid,id);return C.getTicket(st,uid,id);});};
  this.nudge=function(id){return run(function(){C.nudge(st,uid,id);return C.getTicket(st,uid,id);});};
  this.chat=function(){return run(function(){return C.listChat(st,uid);});};
  this.chatPost=function(d){return run(function(){return C.postChat(st,uid,d);});};
  this.digest=function(){return run(function(){if(!C.isAdmin(C.bootstrap(st,uid).me))throw new Error('Только собственник');return C.ownerDigest(st);});};
  this.reports=function(){return run(function(){return C.listReports(st,uid);});};
  this.saveReport=function(r){return run(function(){return C.saveReport(st,uid,r||{});});};
  this.ownerReport=function(){return run(function(){if(C.bootstrap(st,uid).me.role!=='owner')throw new Error('Только собственник');if(!window.ModusReports)return C.saveReport(st,uid,{});var r=window.ModusReports.buildOwnerReport(st,{now:Date.now()});st.reports=st.reports.filter(function(x){return x.id!==r.id;});st.reports.push(r);return r;});};
  this.bonus=function(u,a,why){return run(function(){return C.bonus(st,uid,u,a,why);});};
  this.redemptions=function(){return run(function(){return C.listRedemptions(st,uid);});};
  this.decide=function(id,ok,note){return run(function(){return C.decideRedemption(st,uid,id,ok,note);});};
  this.rewardsAll=function(){return run(function(){return st.rewards.filter(function(r){return r.active!==false;});});};
  this.rewardSet=function(id,p){return run(function(){return C.updateReward(st,uid,id,p);});};
  this.method=function(){return run(function(){return C.methodStats(st);});};
  this.classify=function(id,p){return run(function(){C.classify(st,uid,id,p);return C.getTicket(st,uid,id);});};
  this.kudos=function(to,text){return run(function(){return C.kudos(st,uid,to,text);});};
  this.game=function(){return run(function(){return C.gameState(st,uid);});};
  this.season=function(){return run(function(){return C.seasonBoard(st);});};
  this.questClaim=function(q){return run(function(){return C.claimQuest(st,uid,q);});};
  this.chestOpen=function(){return run(function(){return C.openChest(st,uid);});};
  this.streakClaim=function(){return run(function(){return C.claimStreak(st,uid);});};
  this.privacy=function(h){return run(function(){return C.setHideRating(st,uid,h);});};
  this.teamGoal=function(t,p){return run(function(){return C.setTeamGoal(st,uid,t,p);});};
  this.optAdd=function(id,d){return run(function(){C.proposeOption(st,uid,id,d);return C.getTicket(st,uid,id);});};
  this.optVote=function(id,o){return run(function(){C.voteOption(st,uid,id,o);return C.getTicket(st,uid,id);});};
  this.optChoose=function(id,o,why){return run(function(){C.chooseOption(st,uid,id,o,why);return C.getTicket(st,uid,id);});};
  this.teamPass=function(id,note){return run(function(){C.teamPass(st,uid,id,note);return C.getTicket(st,uid,id);});};
  this.teamAdvance=function(id){return run(function(){C.advanceTeam(st,uid,id);return C.getTicket(st,uid,id);});};
  this.teamDeadlines=function(id,d){return run(function(){C.setTeamDeadlines(st,uid,id,d);return C.getTicket(st,uid,id);});};
  this.stepAdd=function(id,d){return run(function(){C.addStep(st,uid,id,d);return C.getTicket(st,uid,id);});};
  this.stepSet=function(id,sid,p){return run(function(){C.setStep(st,uid,id,sid,p);return C.getTicket(st,uid,id);});};
  this.verify=function(id,d){return run(function(){C.verifyEffect(st,uid,id,d);return C.getTicket(st,uid,id);});};
  this.tasks=function(){return run(function(){return C.myTasks(st,uid);});};
  this.solutions=function(){return run(function(){return C.solutionStats(st);});};
  this.accept=function(id,d){return run(function(){C.accept(st,uid,id,d||{});return C.getTicket(st,uid,id);});};
  this.trash=function(id,r){return run(function(){C.toTrash(st,uid,id,r);return C.getTicket(st,uid,id);});};
  this.restore=function(id){return run(function(){C.restore(st,uid,id);return C.getTicket(st,uid,id);});};
  this.move=function(id,col,o){return run(function(){C.moveCard(st,uid,id,col,o||{});return C.getTicket(st,uid,id);});};
  this.entries=function(){return run(function(){return C.listEntries(st,uid);});};
  this.entrySave=function(id,p){return run(function(){return C.saveEntry(st,uid,id,p);});};
  this.pubEntry=function(code){return run(function(){return C.publicEntry(st,code);});};
  this.pubCreate=function(d){return run(function(){return C.createPublicTicket(st,d.code,d);});};
  this.pubTrack=function(code){return run(function(){return C.trackTicket(st,code);});};

}

function ServerApi(base,health){
  var uid=lsGet(LS_USER)||'u1', self=this;
  this.mode='server';this.health=health||{};this.demo=this.health.demo===true;
  function headers(){var h={'Content-Type':'application/json'};if(App.tgInit)h.Authorization='tma '+App.tgInit;else if(self.demo)h['X-Demo-User']=uid;return h;}
  function req(method,path,body){
    return fetch(base+path,{method:method,credentials:'same-origin',headers:headers(),body:body?JSON.stringify(body):undefined}).then(function(r){
      return r.json().catch(function(){return {};}).then(function(j){if(!r.ok){var e=new Error(j.error||('Ошибка '+r.status));e.code=j.code;e.status=r.status;throw e;}return j;});
    });
  }
  function qs(f){var p=[];for(var k in f)if(f[k]!=null&&f[k]!==''&&f[k]!==false)p.push(k+'='+encodeURIComponent(f[k]===true?'1':f[k]));return p.length?'?'+p.join('&'):'';}
  this.setUser=function(id){if(self.demo){uid=id;lsSet(LS_USER,id);}};
  this.userId=function(){return App.me?App.me.id:uid;};
  this.bootstrap=function(){return req('GET','/api/bootstrap');};
  this.list=function(f){return req('GET','/api/tickets'+qs(f||{}));};
  this.get=function(id){return req('GET','/api/tickets/'+encodeURIComponent(id));};
  this.create=function(d){return req('POST','/api/tickets',d);};
  this.transition=function(id,to,o){var b=o||{};b.to=to;return req('POST','/api/tickets/'+id+'/transition',b);};
  this.comment=function(id,text,o){var b=o||{};b.text=text;return req('POST','/api/tickets/'+id+'/comments',b);};
  this.assign=function(id,u){return req('POST','/api/tickets/'+id+'/assign',{userId:u});};
  this.priority=function(id,p){return req('POST','/api/tickets/'+id+'/priority',{priority:p});};
  this.vote=function(id){return req('POST','/api/tickets/'+id+'/vote');};
  this.similar=function(t){return req('GET','/api/similar?text='+encodeURIComponent(t));};
  this.analytics=function(){return req('GET','/api/analytics');};
  this.leaderboard=function(){return req('GET','/api/leaderboard');};
  this.profile=function(id){return req('GET','/api/profile'+(id?'/'+id:''));};
  this.notifications=function(){return req('GET','/api/notifications');};
  this.markRead=function(ids){return req('POST','/api/notifications/read',{ids:ids});};
  this.redeem=function(rid){return req('POST','/api/rewards/'+rid+'/redeem');};
  this.adminCat=function(id,p){return id?req('PUT','/api/admin/categories/'+id,p):req('POST','/api/admin/categories',p);};
  this.adminUser=function(id,p){return req('PUT','/api/admin/users/'+id,p);};
  this.createUser=function(p){return req('POST','/api/admin/users',p);};
  this.adminSettings=function(p){return req('PUT','/api/admin/settings',p);};
  this.reset=function(){return req('POST','/api/admin/reset');};
  this.exportRows=function(){return req('GET','/api/tickets?sort=created');};
  this.linkTg=function(userId){return req('POST','/api/tg/link',{userId:userId});};
  this.claim=function(id){return req('POST','/api/tickets/'+id+'/claim');};
  this.nudge=function(id){return req('POST','/api/tickets/'+id+'/nudge');};
  this.chat=function(){return req('GET','/api/chat');};
  this.chatPost=function(d){return req('POST','/api/chat',d);};
  this.digest=function(){return req('GET','/api/owner/digest');};
  this.reports=function(){return req('GET','/api/owner/reports');};
  this.saveReport=function(){return req('POST','/api/owner/report',{});};
  this.ownerReport=function(){return req('POST','/api/owner/report',{});};
  this.agentAsk=function(q,h){return req('POST','/api/agent/ask',{question:q,history:h});};
  this.bonus=function(u,a,why){return req('POST','/api/owner/bonus',{userId:u,amount:a,reason:why});};
  this.redemptions=function(){return req('GET','/api/owner/redemptions');};
  this.decide=function(id,ok,note){return req('POST','/api/owner/redemptions/'+id,{approve:ok,note:note});};
  this.rewardsAll=function(){return req('GET','/api/bootstrap').then(function(b){return b.rewards.filter(function(r){return r.active!==false;});});};
  this.rewardSet=function(id,p){return id?req('PUT','/api/admin/rewards/'+id,p):req('POST','/api/admin/rewards',p);};
  this.method=function(){return req('GET','/api/method');};
  this.classify=function(id,p){return req('POST','/api/tickets/'+id+'/classify',p);};
  this.kudos=function(to,text){return req('POST','/api/kudos',{toUserId:to,text:text});};
  this.rewrite=function(text,kind){return req('POST','/api/agent/rewrite',{text:text,kind:kind});};
  this.game=function(){return req('GET','/api/game');};
  this.season=function(){return req('GET','/api/game/season');};
  this.questClaim=function(q){return req('POST','/api/game/quests/'+q+'/claim');};
  this.chestOpen=function(){return req('POST','/api/game/chest');};
  this.streakClaim=function(){return req('POST','/api/game/streak');};
  this.privacy=function(h){return req('PUT','/api/game/privacy',{hide:h});};
  this.teamGoal=function(t,p){return req('PUT','/api/admin/team-goal',{target:t,prize:p});};
  this.optAdd=function(id,d){return req('POST','/api/tickets/'+id+'/options',d);};
  this.optVote=function(id,o){return req('POST','/api/tickets/'+id+'/options/'+o+'/vote');};
  this.optChoose=function(id,o,why){return req('POST','/api/tickets/'+id+'/options/'+o+'/choose',{reason:why});};
  this.teamPass=function(id,note){return req('POST','/api/tickets/'+id+'/team/pass',{note:note});};
  this.teamAdvance=function(id){return req('POST','/api/tickets/'+id+'/team/advance',{});};
  this.teamDeadlines=function(id,d){return req('POST','/api/tickets/'+id+'/team/deadlines',d);};
  this.stepAdd=function(id,d){return req('POST','/api/tickets/'+id+'/steps',d);};
  this.stepSet=function(id,sid,p){return req('PATCH','/api/tickets/'+id+'/steps/'+sid,p);};
  this.verify=function(id,d){return req('POST','/api/tickets/'+id+'/verify',d);};
  this.tasks=function(){return req('GET','/api/tasks');};
  this.solutions=function(){return req('GET','/api/solutions');};
  this.aiOptions=function(id){return req('POST','/api/agent/solutions',{ticketId:id});};
  this.accept=function(id,d){return req('POST','/api/tickets/'+id+'/accept',d||{});};
  this.trash=function(id,r){return req('POST','/api/tickets/'+id+'/trash',{reason:r});};
  this.restore=function(id){return req('POST','/api/tickets/'+id+'/restore',{});};
  this.move=function(id,col,o){var b=o||{};b.col=col;return req('POST','/api/tickets/'+id+'/move',b);};
  this.entries=function(){return req('GET','/api/admin/entries');};
  this.entrySave=function(id,p){return id?req('PUT','/api/admin/entries/'+id,p):req('POST','/api/admin/entries',p);};
  this.pubEntry=function(code){return req('GET','/api/public/entry/'+encodeURIComponent(code));};
  this.pubCreate=function(d){return req('POST','/api/public/tickets',d);};
  this.pubTrack=function(code){return req('GET','/api/public/track/'+encodeURIComponent(code));};

}

/* ═════════════ Состояние приложения ═════════════ */
var App = { api:null, me:null, boot:null, tma:false, tgInit:'', tg:null, unread:0, ui:{ listView:'list', filters:{scope:'all',status:'open'}, form:null, boardScope:'manage' } };
var TeamUI=window.ModusTeamUI.create({esc:esc,fmt:fmt,me:function(){return App.me;}});
window.ModusApp = App;

function isDemoMode(){return !!App.api&&(App.api.mode==='local'||App.api.demo===true);}
function sessionHeaders(){return App.tgInit?{Authorization:'tma '+App.tgInit}:{};}
function isStaff(){return !!App.me&&(App.me.role==='manager'||App.me.role==='admin'||App.me.role==='owner');}
function userName(id){var u=(App.boot.users||[]).filter(function(x){return x.id===id;})[0];return u?u.name:'—';}
function catName(id){var c=(App.boot.categories||[]).filter(function(x){return x.id===id;})[0];return c?c.name:'—';}

function toast(msg,isErr){var t=document.createElement('div');t.className='toast'+(isErr?' err':'');t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove();},isErr?4200:2600);if(App.tg&&App.tg.HapticFeedback){try{App.tg.HapticFeedback.notificationOccurred(isErr?'error':'success');}catch(e){}}}

function statusPill(s){var x=D.STATUSES[s]||{label:s,tone:'grey'};return '<span class="pill t-'+x.tone+'">'+esc(x.label)+'</span>';}
function typeTag(t){var x=D.TYPES[t];return '<span class="tag type-'+t+'">'+x.icon+' '+esc(x.short)+'</span>';}
function prioTag(p){return '<span class="tag">'+(p==='high'?'<b style="color:var(--red)">●</b>':p==='medium'?'<b style="color:var(--amber)">●</b>':'<b style="color:var(--grey)">●</b>')+' '+esc(D.PRIORITIES[p].label)+'</span>';}
function slaBadge(t){
  if(!D.STATUSES[t.status].open) return t.closedAt?'<span class="sla ok">✓ '+fmt(t.closedAt)+'</span>':'';
  if(t.overdue) return '<span class="sla bad">⏰ '+esc(t.overdue.label)+(t.overdue.hours?' · +'+dur(t.overdue.hours):'')+'</span>';
  if(t.status==='clarify') return '<span class="sla warn">◷ Ждём автора</span>';
  if(!t.firstResponseAt){var h=hoursTo(t.respondDue);return '<span class="sla '+(h<8?'warn':'ok')+'">◷ Ответ до '+fmt(t.respondDue)+'</span>';}
  return '<span class="sla ok">◷ Решение до '+fmt(t.resolveDue)+'</span>';
}
function ticketItem(t){
  return '<a class="ti'+(t.overdue?' over':'')+'" href="#/t/'+t.id+'">'+
    '<div><div class="row" style="gap:8px;margin-bottom:4px"><span class="id">'+t.id+'</span>'+typeTag(t.type)+'<span class="tag">'+esc(t.categoryName)+'</span>'+(t.anonymous?'<span class="tag">🕶 Анонимно</span>':'')+'</div>'+
    '<div class="ttl">'+esc(t.title)+'</div>'+
    '<div class="meta"><span>'+esc(t.authorName)+(t.anonymous?'':' · '+esc(t.authorDept))+'</span><span>→ '+esc(t.assigneeName)+'</span><span>'+ago(t.createdAt)+'</span></div></div>'+
    '<div class="right">'+statusPill(t.status)+slaBadge(t)+(t.votesCount?'<span class="votes">+'+t.votesCount+' поддержали</span>':'')+'</div></a>';
}
function emptyBox(icon,text,cta){return '<div class="card empty"><div class="e">'+icon+'</div><div>'+text+'</div>'+(cta||'')+'</div>';}
function pathSteps(t){
  var map={new:0,review:1,clarify:1,work:2,done:3,closed:3,rejected:1};
  var cur=map[t.status], labels=['Зарегистрировано','Рассмотрение','В работе',t.type==='praise'?'Закрыто':'Реализовано'];
  if(t.status==='clarify')labels[1]='Уточнение'; if(t.status==='rejected')labels[1]='Отклонено';
  return '<div class="path">'+labels.map(function(l,i){var c='';if(i<cur)c='done';if(i===cur){c=t.status==='clarify'?'warn':t.status==='rejected'?'stop':(t.status==='done'||t.status==='closed')?'done':'cur';}
    if(t.status==='rejected'&&i>1)c='';
    return '<div class="st '+c+'"><div class="c">'+(c==='done'?'✓':c==='stop'?'✕':c==='warn'?'?':i+1)+'</div>'+esc(l)+'</div>';}).join('')+'</div>';
}

var modalFocus=null;
function modal(html){
  closeModal();modalFocus=document.activeElement;
  var o=document.createElement('div');o.className='ov';o.id='ov';o.innerHTML='<div class="modal" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" tabindex="-1">'+html+'</div>';
  var heading=o.querySelector('h2');if(heading)heading.id='dialogTitle';else{o.firstElementChild.removeAttribute('aria-labelledby');o.firstElementChild.setAttribute('aria-label','Просмотр');}
  o.addEventListener('click',function(e){if(e.target===o)closeModal();});
  o.addEventListener('keydown',function(e){
    if(e.key==='Escape'){e.preventDefault();closeModal();return;}
    if(e.key!=='Tab')return;
    var items=Array.from(o.querySelectorAll('button:not(:disabled),input:not(:disabled),textarea:not(:disabled),select:not(:disabled),a[href],[tabindex="0"]')).filter(function(x){return x.getClientRects().length;});
    var first=items[0],last=items[items.length-1];
    if(!first){e.preventDefault();return;}if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  });
  document.body.appendChild(o);var f=o.querySelector('textarea,input,select,button')||o.firstElementChild;setTimeout(function(){if(f.isConnected)f.focus();},50);
}
function closeModal(){var o=$('#ov');if(o)o.remove();if(modalFocus&&modalFocus.isConnected)modalFocus.focus();modalFocus=null;}

var Files={
  mem:{}, urls:{},
  db:function(){if(this._db)return this._db;this._db=new Promise(function(res){try{var r=indexedDB.open('modus-signal-files',1);r.onupgradeneeded=function(){r.result.createObjectStore('f');};r.onsuccess=function(){res(r.result);};r.onerror=function(){res(null);};}catch(e){res(null);}});return this._db;},
  idbPut:function(id,blob){var self=this;return this.db().then(function(db){if(!db){self.mem[id]=blob;return;}return new Promise(function(res){try{var tx=db.transaction('f','readwrite');tx.objectStore('f').put(blob,id);tx.oncomplete=res;tx.onerror=function(){self.mem[id]=blob;res();};}catch(e){self.mem[id]=blob;res();}});});},
  idbGet:function(id){var self=this;if(self.mem[id])return Promise.resolve(self.mem[id]);return this.db().then(function(db){if(!db)return null;return new Promise(function(res){try{var rq=db.transaction('f').objectStore('f').get(id);rq.onsuccess=function(){res(rq.result||null);};rq.onerror=function(){res(null);};}catch(e){res(null);}});});},
  shrink:function(file){
    if(!/^image\/(jpeg|png|webp)$/.test(file.type)||file.size<1.2e6)return Promise.resolve(file);
    return new Promise(function(res){var img=new Image(),u=URL.createObjectURL(file);img.onload=function(){var k=Math.min(1,1920/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(function(b){res(b&&b.size<file.size?new File([b],file.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):file);},'image/jpeg',.85);};img.onerror=function(){res(file);};img.src=u;});
  },
  put:function(file){
    var self=this, max=25*1048576;
    if(file.size>max)return Promise.reject(new Error('Файл «'+file.name+'» больше 25 МБ'));
    var type=(file.type&&file.type!=='application/octet-stream')?file.type:guessType(file.name);
    var kind=type.indexOf('image/')===0?'image':type.indexOf('video/')===0?'video':'doc';
    return self.shrink(file).then(function(f){
      if(App.api.mode==='server'){
        var h={'Content-Type':type,'X-File-Name':encodeURIComponent(f.name)};if(App.tgInit)h.Authorization='tma '+App.tgInit;else if(isDemoMode())h['X-Demo-User']=App.api.userId();
        return fetch(App.pub&&isPubPath(parseHash().path)?'/api/public/files?code='+encodeURIComponent(App.pub.code):'/api/files',{method:'POST',credentials:'same-origin',headers:h,body:f}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||'Не удалось загрузить файл');return j;});});
      }
      var viaAssets=App.assets&&/^(image\/(png|jpeg|gif|webp)|video\/(mp4|webm)|application\/pdf|text\/(plain|csv))$/.test(type)&&f.size<=20*1048576;
      var p=viaAssets?App.assets.upload(f,{type:type}).then(function(r){return {id:r.id,name:f.name,size:f.size,type:type,kind:kind,url:'/_blob/'+r.id};}).catch(function(){return null;}):Promise.resolve(null);
      return p.then(function(meta){
        if(meta)return meta;
        var id='f'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
        return self.idbPut(id,f).then(function(){return {id:id,name:f.name,size:f.size,type:type,kind:kind,url:'idb:'+id};});
      });
    });
  },
  hydrate:function(root){
    var self=this;
    $$('[data-idb]',root).forEach(function(el){var k=el.getAttribute('data-idb').slice(4);el.removeAttribute('data-idb');self.objUrl(k).then(function(u){if(u)el.src=u;else el.closest('.fthumb,.fvidw')&&(el.closest('.fthumb,.fvidw').innerHTML='<span class="muted small">Файл доступен на устройстве автора</span>');});});
    $$('[data-idb-href]',root).forEach(function(el){var k=el.getAttribute('data-idb-href').slice(4);el.removeAttribute('data-idb-href');self.objUrl(k).then(function(u){if(u)el.href=u;});});
  },
  objUrl:function(k){var self=this;if(self.urls[k])return Promise.resolve(self.urls[k]);return self.idbGet(k).then(function(b){if(!b)return null;self.urls[k]=URL.createObjectURL(b);return self.urls[k];});}
};
function guessType(n){var e=(n.split('.').pop()||'').toLowerCase();return {jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',gif:'image/gif',webp:'image/webp',heic:'image/heic',mp4:'video/mp4',mov:'video/quicktime',webm:'video/webm',pdf:'application/pdf',doc:'application/msword',docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',xls:'application/vnd.ms-excel',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',txt:'text/plain',csv:'text/csv'}[e]||'application/octet-stream';}

/* ── Простой markdown для доклада ИИ (с экранированием) ── */
function md(text){
  var lines=esc(text||'').split('\n'),out=[],list=null;
  function close(){if(list){out.push('</'+list+'>');list=null;}}
  lines.forEach(function(l){
    var t=l.trim(),m;
    var inl=function(x){return x.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^\w])\*(?!\s)(.+?)\*(?=[^\w]|$)/g,'$1<i>$2</i>').replace(/`(.+?)`/g,'<code>$1</code>').replace(/\b(A-\d{3,})\b/g,'<a href="#/t/$1">$1</a>');};
    if(!t){close();return;}
    if((m=t.match(/^#{1,4}\s+(.*)$/))){close();out.push('<h3 class="mdh">'+inl(m[1])+'</h3>');return;}
    if((m=t.match(/^[-•*]\s+(.*)$/))){if(list!=='ul'){close();out.push('<ul>');list='ul';}out.push('<li>'+inl(m[1])+'</li>');return;}
    if((m=t.match(/^\d+[.)]\s+(.*)$/))){if(list!=='ol'){close();out.push('<ol>');list='ol';}out.push('<li>'+inl(m[1])+'</li>');return;}
    close();out.push('<p>'+inl(t)+'</p>');
  });
  close();return '<div class="md">'+out.join('')+'</div>';
}

var AI={
  ready:function(){return App.sample?Promise.resolve(App.sample):Promise.resolve(null);},
  report:function(digest,onText){
    if(App.api.mode==='server') return App.api.ownerReport();
    return AI.ready().then(function(sm){
      if(!sm){return App.api.saveReport({source:'rules'});}
      return sm(C.agentPrompt(digest),{onText:onText,cache:false}).then(function(r){return App.api.saveReport({source:'ai',text:r.text,model:'Claude'});});
    });
  },
  ask:function(digest,q,history,onText){
    if(App.api.mode==='server') return App.api.agentAsk(q,history);
    return AI.ready().then(function(sm){
      if(!sm) return {text:ruleAnswer(digest,q),source:'rules'};
      var turns=[{role:'user',content:C.agentPrompt(digest)+'\n\nДалее собственник задаёт вопросы. Отвечай кратко, по данным выше.'}].concat(history.slice(-6)).concat([{role:'user',content:q}]);
      return sm(turns,{onText:onText,cache:false}).then(function(r){return {text:r.text,source:'ai'};});
    });
  }
};
function ruleAnswer(d,q){
  q=q.toLowerCase();
  if(/поощр|наград|премир/.test(q)) return d.reward.length?'## Кого поощрить\n'+d.reward.map(function(r){return '- **'+r.name+'**: '+r.reasons.join('; ')+' → предлагаю +'+r.suggest+' монет';}).join('\n'):'Пока нет кандидатов с подтверждённым результатом.';
  if(/тормоз|риск|уволь|попрощ|расста/.test(q)) return d.risk.length?'## Зона риска\n'+d.risk.map(function(r){return '- **'+r.name+'**: '+r.evidence.join('; ')+'\n- Рекомендация: '+r.recommendation;}).join('\n'):'Явных кандидатов в зону риска нет.';
  if(/маршрут|корректир|настро|поправ/.test(q)) return '## Корректировки\n'+d.corrections.map(function(c){return '- **'+c.title+'** — '+c.detail;}).join('\n');
  if(/план|дальше|недел/.test(q)) return '## Что делать дальше\n'+d.nextSteps.map(function(s,i){return (i+1)+'. '+s;}).join('\n');
  return C.digestText(d);
}

  return '<div class="card"><h2>🎁 Заявки на награды <span class="muted" style="font-weight:600">· '+pend.length+'</span></h2>'+(pend.length?pend.map(function(x){return '<div class="orow"><div class="row" style="gap:10px;flex-wrap:nowrap">'+ava(x.userId,x.userName,null,32)+'<div><b>'+esc(x.userName)+'</b><div class="small">'+esc(x.icon||'')+' '+esc(x.name)+' · '+x.cost+' 🪙 · '+fmt(x.at)+'</div></div></div><span class="row" style="gap:6px"><button class="btn red sm" data-act="redOk" data-v="'+x.id+'">Одобрить</button><button class="btn line sm" data-act="redNo" data-v="'+x.id+'">Отказать</button></span></div>';}).join(''):'<div class="muted">Новых заявок нет</div>')+'</div>';
}

      '<div class="askbar"><input class="inp" id="askIn" placeholder="Например: почему горит A-011 и что сделать сегодня?"><button class="btn navy" data-act="ask">Спросить</button></div></div>';

function viewProblems(params){
  var P=App.ui.prob||(App.ui.prob={sort:'priority',priority:'',status:'open',overdue:''});
  if(params){for(var k in params)P[k]=params[k];}
  return App.api.list({status:P.stage?'all':(P.status||'open'),sort:P.sort,priority:P.priority,overdue:P.overdue?true:'',stage:P.stage||''}).then(function(list){
    list=list.filter(function(t){return t.type!=='praise';});
    var staff=isStaff();
    var rows=list.map(function(t){
      var mineEx=t.executorId===App.me.id, taken=t.executorId&&!mineEx;
      var btn='';
      if(staff) btn=(t.status==='work'&&t.assigneeId===App.me.id)?'<span class="pill t-red">У вас в работе</span>':'<button class="btn red sm" data-act="claim" data-v="'+t.id+'">Взять в работу</button>';
      else if(t.mine&&!t.executorId) btn='';
      else btn=taken?'<span class="small muted">Решает: '+esc(t.executorName)+'</span>':'<button class="btn '+(mineEx?'navy':'line')+' sm" data-act="claim" data-v="'+t.id+'">'+(mineEx?'✓ Я решаю':'✋ Возьмусь сам')+'</button>';
      return '<div class="prow pr-'+t.priority+(t.overdue?' over':'')+'"><div class="pbar"></div><a href="#/t/'+t.id+'" class="pmain"><div class="row" style="gap:6px"><span class="id">'+t.id+'</span>'+typeTag(t.type)+prioTag(t.priority)+statusPill(t.status)+'</div><div class="ttl" style="margin:4px 0">'+esc(t.title)+'</div>'+(t.stage?'<div class="row" style="gap:8px;margin-bottom:4px">'+stagePill(t)+(t.options&&t.options.length&&!t.decision?'<span class="small muted">💡 вариантов: '+t.options.length+'</span>':'')+(t.planProgress?'<span class="pp"><span class="qbar"><i style="width:'+t.planProgress.pct+'%;background:var(--green)"></i></span><span class="small">'+t.planProgress.done+'/'+t.planProgress.total+'</span></span>':'')+'</div>':'')+'<div class="meta">'+esc(t.categoryName)+' · → '+esc(t.assigneeName)+(t.executorName?' · ✋ '+esc(t.executorName):'')+' · '+slaBadge(t)+'</div></a>'+
        '<div class="pact"><button class="btn '+(t.voted?'navy':'line')+' sm" data-act="voteRow" data-v="'+t.id+'" '+(t.mine?'disabled title="Своё обращение"':'')+'>+'+t.votesCount+'</button>'+btn+'</div></div>';
    }).join('');
    return '<div class="pagehead"><div><div class="eyebrow">Все открытые проблемы и идеи компании</div><h1>Проблемы и решения</h1><div class="muted">'+list.length+' · сортировка: '+({priority:'по приоритету',votes:'по поддержке',created:'сначала новые',due:'по сроку'})[P.sort]+'</div></div><a class="btn red sm" href="#/new">＋ Новая проблема</a></div>'+
      '<div class="filters"><div class="seg">'+[['priority','Приоритет'],['votes','Поддержка'],['due','Срок'],['created','Новые']].map(function(s){return '<button class="'+(P.sort===s[0]?'on':'')+'" data-act="probSet" data-k="sort" data-v="'+s[0]+'">'+s[1]+'</button>';}).join('')+'</div>'+
      '<span style="width:6px"></span>'+[['','Все'],['high','🔴 Высокий'],['medium','🟠 Средний'],['low','⚪ Низкий']].map(function(p){return '<button class="chip'+(P.priority===p[0]?' on':'')+'" data-act="probSet" data-k="priority" data-v="'+p[0]+'">'+p[1]+'</button>';}).join('')+
      '<button class="chip red'+(P.overdue?' on':'')+'" data-act="probSet" data-k="overdue" data-v="'+(P.overdue?'':'1')+'">🔥 Горит</button>'+
      '<select class="sel" data-change="probSel" data-k="status"><option value="open">Все открытые</option>'+['new','review','clarify','work'].map(function(s){return '<option value="'+s+'"'+(P.status===s?' selected':'')+'>'+D.STATUSES[s].label+'</option>';}).join('')+'</select></div>'+
      '<div class="filters">'+[['','Все этапы'],['problem','💡 Ищем решение'],['options','⚖ Выбор решения'],['plan','🗂 Нужен план'],['doing','🔧 Внедрение'],['verify','🔎 Проверка эффекта'],['solved','🏁 Решено']].map(function(x){return '<button class="chip'+((P.stage||'')===x[0]?' on':'')+'" data-act="stageSet" data-v="'+x[0]+'">'+x[1]+'</button>';}).join('')+'</div>'+
      '<div class="plist">'+(rows||emptyBox('🎉','Открытых проблем нет'))+'</div>'+
      '<div class="small muted" style="margin-top:10px">'+(staff?'«Взять в работу» — обращение назначается на вас и переходит в статус «В работе». Автор получит уведомление.':'«Возьмусь сам» — вы вызываетесь решить проблему. Ответственный подтвердит результат, а вы получите +'+D.POINTS.executor.amount+' монет.')+'</div>';
  });
}

function chatItems(list){
  var lastDay='';
  return list.map(function(m){
    var day=new Date(m.at).toLocaleDateString('ru-RU',{day:'numeric',month:'long'}), sep='';
    if(day!==lastDay){sep='<div class="daysep"><span>'+day+'</span></div>';lastDay=day;}
    var txt=esc(m.text).replace(/#?(A-\d{3,})/g,'<a href="#/t/$1">$1</a>').replace(/\n/g,'<br>');
    if(m.kind==='celebrate'||!m.userId) return sep+'<div class="msg sys"><div class="bub">'+txt+(m.refTicket?' <a href="#/t/'+m.refTicket+'">Открыть</a>':'')+'</div></div>';
    if(m.kind==='kudos') return sep+'<div class="msg kudos'+(m.mine?' mine':'')+'">'+ava(m.userId,m.userName,m.userRole,34)+'<div class="bub"><div class="who2">🙏 '+esc(m.userName)+' → '+esc(m.toName||'')+' <span>'+new Date(m.at).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})+'</span></div><div>'+txt+'</div></div></div>';

function burst(emoji){
  var box=document.createElement('div');box.className='burst';
  for(var i=0;i<26;i++){var s=document.createElement('span');s.textContent=emoji[i%emoji.length];s.style.left=(50+(Math.random()-.5)*20)+'%';s.style.setProperty('--dx',((Math.random()-.5)*520)+'px');s.style.setProperty('--dy',(-180-Math.random()*320)+'px');s.style.animationDelay=(Math.random()*.15)+'s';box.appendChild(s);}
  document.body.appendChild(box);setTimeout(function(){box.remove();},1800);
  if(App.tg&&App.tg.HapticFeedback){try{App.tg.HapticFeedback.notificationOccurred('success');}catch(e){}}
}

var STAGE_ORDER=['problem','options','plan','doing','verify','solved'];
function stagePill(t){var tone={problem:'blue',options:'amber',plan:'navy',doing:'red',verify:'amber',solved:'green',closed:'grey'}[t.stage]||'grey';return '<span class="pill t-'+tone+'">'+esc(t.stageLabel||'')+'</span>';}
function solutionPath(t){
  if(t.type==='praise'||t.stage==='closed') return pathSteps(t);
  var labels=['Проблема','Варианты','Решение','План и внедрение','Проверка эффекта','Решено'];
  var cur={problem:0,options:1,plan:2,doing:3,verify:4,solved:5}[t.stage];
  return '<div class="path">'+labels.map(function(l,i){var c=i<cur?'done':i===cur?(t.stage==='solved'?'done':'cur'):'';return '<div class="st '+c+'"><div class="c">'+(c==='done'?'✓':i+1)+'</div>'+esc(l)+'</div>';}).join('')+'</div>';
}
function progressBar(pp){return pp?'<div class="pprog"><div class="qbar"><i style="width:'+pp.pct+'%;background:var(--green)"></i></div><span class="small"><b>'+pp.done+'/'+pp.total+'</b> шагов</span></div>':'';}

var SRC_IC={site:'🌐',social:'💬',object:'🏗',office:'🏢',app:'📱'};
function srcTag(t){return '<span class="src" title="Точка входа: откуда пришло обращение">'+(SRC_IC[t.entryKind]||'📱')+' '+esc(t.entryName||'Приложение')+'</span>';}
function dueTag(t){if(!t.resolveDue||t.board==='solved'||t.board==='check')return '';return '<span class="due'+(t.overdue?' bad':'')+'">'+(t.overdue?'⏰ ':'до ')+C.fmtShort(t.resolveDue)+'</span>';}
function ymd(d){function p(n){return n<10?'0'+n:''+n;}return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function colLabel(k){var c=window.ModusTeamUI.columns.concat(App.boot.board||[]).filter(function(x){return x.key===k;})[0];return c?c.label:'';}
function navOn(href,h){
  h=h||'#/';
  if(!App.boot||!App.boot.triage)return href==='#/'?(h==='#/'||h===''):h.indexOf(href)===0;
  if(href==='#/')return h==='#/'||h===''||h==='#'||h.indexOf('#/t/')===0||h.indexOf('#/new')===0||h.indexOf('#/board')===0;
  if(href==='#/more')return !navOn('#/',h)&&h.indexOf('#/tasks')!==0&&h.indexOf('#/inbox')!==0;
  return h.indexOf(href)===0;
}
function navItems(){
  if(!App.boot.triage)return navItemsOld();
  var it=[['#/',navIcon('#/'),'Доска'],['#/tasks',navIcon('#/tasks'),'Мои задачи','tasks']];
  if(App.boot.canTriage)it.push(['#/inbox',navIcon('#/inbox'),'Входящие','inbox']);
  it.push(['#/assistant','✦','ИИ-помощник'],['#/more',navIcon('#/more'),'Ещё']);

}
function bottomNav(){
  if(!App.boot.triage)return [[isOwnerish()?'#/owner':'#/','⌂',isOwnerish()?'Кабинет':'Главная'],['#/problems','☰','Проблемы'],['#/new','＋','','plus'],['#/tasks','✓','Задачи','tasks'],['#/chat','✉','Чат']];
  var it=[['#/','▦','Доска'],['#/tasks','✓','Задачи','tasks'],['#/new','＋','','plus']];

function viewBoard(){
  if(!App.boot.triage)return viewBoardOld();
  var F=App.ui.board=App.ui.board||{my:false,overdue:false,entryId:'',assigneeId:'',q:''};
  return App.api.list({box:'board',my:F.my,overdue:F.overdue,entryId:F.entryId,assigneeId:F.assigneeId,q:F.q,sort:'priority'}).then(function(list){
    App.boardList=list;
    var staff=App.boot.users.filter(function(u){return u.disabled!==true&&u.active!==false;});
    var banner=App.boot.canTriage&&App.inboxCount?'<div class="banner"><div><b>📥 Во входящих '+App.inboxCount+' '+plural(App.inboxCount,'обращение ждёт','обращения ждут','обращений ждут')+' вашего решения</b><div class="small" style="opacity:.8">Пока вы не решите, их нет на доске</div></div><a class="btn red" href="#/inbox">Разобрать</a></div>':'';
    var chip=function(label,on,v){return '<button class="chip'+(on?' on':'')+'" data-act="boardChip" data-v="'+v+'">'+label+'</button>';};
    var filters='<div class="bfilters" role="search" aria-label="Фильтры доски">'+chip('Все',!F.my&&!F.overdue,'all')+chip('Мои',F.my,'my')+chip('Просроченные',F.overdue,'overdue')+
      '<select class="sel" aria-label="Точка входа" data-change="boardSel" data-k="entryId"><option value="">Все точки входа</option><option value="app"'+(F.entryId==='app'?' selected':'')+'>Приложение и Telegram</option>'+(App.boot.entries||[]).map(function(e){return '<option value="'+e.id+'"'+(F.entryId===e.id?' selected':'')+'>'+esc(e.name)+'</option>';}).join('')+'</select>'+
      '<select class="sel" aria-label="Ответственный" data-change="boardSel" data-k="assigneeId"><option value="">Все ответственные</option>'+staff.map(function(u){return '<option value="'+u.id+'"'+(F.assigneeId===u.id?' selected':'')+'>'+esc(u.name)+'</option>';}).join('')+'</select>'+
      '<input class="inp" type="search" id="bq" data-change="boardQ" aria-label="Поиск обращений" placeholder="Найти обращение…" value="'+esc(F.q||'')+'"></div>';
    var hint={todo:'Сюда попадают обращения, которые собственник принял в работу',doing:'Здесь карточки, по которым идут шаги',check:'Здесь карточки с записанным результатом',solved:'Здесь подтверждённые результаты'};
    var cols=window.ModusTeamUI.columns.map(function(c){
      var arr=list.filter(function(t){return window.ModusTeamUI.column(t)===c.key;});
      if(c.key==='solved')arr.sort(function(a,b){return new Date(b.updatedAt)-new Date(a.updatedAt);});
      var shown=c.key==='solved'?arr.slice(0,12):arr;
      return '<div class="bcol" data-col="'+c.key+'"><h4 title="'+esc(c.hint)+'">'+esc(c.label)+'<span class="n">'+arr.length+'</span></h4>'+
        (shown.length?shown.map(boardCard).join(''):'<div class="board-empty"><span>Пока нет карточек</span><p>'+esc(c.hint)+'</p></div>')+
        (arr.length>shown.length?'<a class="small" style="display:block;padding:4px" href="#/tickets?status=closed">Ещё '+(arr.length-shown.length)+' в архиве →</a>':'')+'</div>';
    }).join('');
    var overview='<div class="board-overview" aria-label="Сводка по выбранным обращениям">'+[['В работе',list.filter(function(t){return t.board==='doing';}).length],['Ждут проверки',list.filter(function(t){return t.board==='check';}).length],['Просрочены',list.filter(function(t){return t.overdue;}).length],['Решены',list.filter(function(t){return t.board==='solved';}).length]].map(function(x,i){return '<div class="overview-item'+(i===2&&x[1]?' alert':'')+'"><span>'+x[0]+'</span><strong>'+x[1]+'</strong></div>';}).join('')+'</div>';
    return '<div class="pagehead"><div class="workspace-heading"><div class="eyebrow">Рабочее пространство</div><h1>Доска решений</h1><p class="workspace-caption">Есть проблема — решаем вместе. Сначала предложения, затем голосование и выполнение.</p></div><span class="workspace-date">'+esc(new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric',timeZone:'Asia/Tashkent'}))+'</span></div>'+banner+overview+filters+
      '<div class="board" id="board">'+cols+'</div><div class="muted small board-help" style="margin-top:16px">Откройте проблему: внутри видно, какой вклад команда ждёт от вас.</div>';
  });
}

function boardRefresh(){

    var p=parseHash().path;

function moveCard(id,col){
  var onCard=parseHash().path.indexOf('/t/')===0&&App.cur&&App.cur.id===id;
  var t=onCard?App.cur:(App.boardList||[]).filter(function(x){return x.id===id;})[0];
  if(!t||t.board===col)return;
  App.move={id:id,col:col};
  var sub='<div class="muted small" style="margin:-6px 0 14px">'+t.id+' · '+esc(t.title)+'</div>';
  var foot=function(label){return '<div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn line" data-act="closeModal">Отмена</button><button class="btn red" data-act="moveGo">'+label+'</button></div>';};
  if(col==='check'){
    if(t.board==='solved')return toast('Решённую карточку сначала верните в работу',true);
    return modal('<h2>Записать результат</h2>'+sub+'<div class="field"><label class="f req">Что сделано</label><textarea class="inp" id="mvResult" placeholder="Например: заменили контроллер, сутки без сбоев"></textarea><div class="help">Карточка перейдёт в «На проверке». Собственник подтвердит результат или вернёт её в работу.</div></div>'+foot('На проверку'));
  }
  if(col==='doing'&&t.board==='check')return modal('<h2>Вернуть в работу</h2>'+sub+'<div class="field"><label class="f req">Что не так с результатом?</label><textarea class="inp" id="mvComment" placeholder="Например: сбой повторился вечером"></textarea><div class="help">Ответственный получит уведомление с вашим комментарием.</div></div>'+foot('Вернуть в работу'));
  if(col==='solved'){
    if(t.board!=='check')return toast('В «Решено» карточка попадает только из «На проверке»',true);
    return modal('<h2>Подтвердить результат?</h2>'+sub+'<div class="block res" style="margin-top:0"><div class="lab" style="color:var(--green)">Что сделано</div><div style="font-weight:600">'+esc(t.result||'—')+'</div></div><p class="small muted">Карточка перейдёт в «Решено», автор получит уведомление.</p>'+foot('Подтвердить'));
  }
  doMove({});

function doMove(o){
  var m=App.move;if(!m)return;

function copyText(s){
  var done=function(){toast('Ссылка скопирована');};
  try{if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(s).then(done,function(){legacy();});}catch(e){}
  function legacy(){var ta=document.createElement('textarea');ta.value=s;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){toast('Скопируйте ссылку вручную',true);}ta.remove();}
  legacy();
}
function saveFile(name,text,mime){
  var plain=function(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Файл сохранён: '+name);};
  if(window.claude&&typeof window.claude.use==='function')return window.claude.use('downloads').then(function(dl){if(!dl)return plain();return dl.save({filename:name,data:text}).then(function(){toast('Файл сохранён: '+name);});}).catch(function(){toast('Сохранение отменено',true);});
  plain();
}

function refreshCounters(){
  var ps=[App.api.notifications().then(function(l){App.unread=l.filter(function(n){return !n.read;}).length;})];
  ps.push(App.api.tasks().then(function(k){App.taskCount=k.total;}).catch(function(){}));
  if(App.boot&&App.boot.triage){if(App.boot.canTriage)ps.push(App.api.list({box:'inbox'}).then(function(l){App.inboxCount=l.length;}));else App.inboxCount=0;}
  else if(isStaff())ps.push(App.api.list({scope:'manage',status:'open'}).then(function(l){App.inboxCount=l.filter(function(t){return t.overdue||!t.firstResponseAt;}).length;}));else App.inboxCount=0;
  return Promise.all(ps).catch(function(){});
}

/* ═════════════ Маршрутизатор ═════════════ */
function parseHash(){
  var h=(location.hash||'#/').replace(/^#/,'');
  var cut=h.search(/[?&]?tgWebApp/); if(cut>=0)h=h.slice(0,cut);
  var parts=h.split('?'), path=parts[0]||'/', q={};
  (parts[1]||'').split('&').forEach(function(kv){if(!kv)return;var a=kv.split('=');q[decodeURIComponent(a[0])]=decodeURIComponent(a[1]||'');});
  return {path:path,q:q};
}
var renderSeq=0;
function render(){
  var r=parseHash();
  if(isPubPath(r.path))return renderPublic(r);
  if(!App.boot)return start(true);
  var seq=++renderSeq;
  document.getElementById('root').innerHTML=shell();
  bindSearch();
  var p=r.path, m, job;
  if(p==='/'||p==='') job=App.boot.triage?viewBoard():viewHomeSimple();
  else if(p==='/home') job=viewHomeSimple();
  else if(p==='/more') job=viewMore();
  else if(p==='/assistant') job=Promise.resolve(viewAssistant());
  else if(p==='/assigned') job=viewInboxOld();
  else if(p==='/owner') job=viewOwner();
  else if(p==='/problems') job=viewProblems(Object.keys(r.q).length?r.q:null);
  else if(p==='/chat') job=viewChat();
  else if(p==='/method') job=Promise.resolve('<div class="pagehead"><h1>Решаем проблемы вместе</h1></div>'+TeamUI.coins());
  else if(p==='/tasks') job=viewTasks();
  else if(p==='/new') job=viewNew();
  else if(p==='/tickets') job=viewTickets(Object.keys(r.q).length?r.q:null);
  else if(p==='/inbox') job=viewInbox();
  else if(p==='/board') job=viewBoard();
  else if((m=p.match(/^\/t\/(.+)$/))) job=viewTicket(decodeURIComponent(m[1]));
  else if(p==='/analytics') job=viewAnalytics();

function detectTelegram(){
  var raw=location.hash+location.search;
  if(raw.indexOf('tgWebApp')<0&&!/[?&]tma=1/.test(location.search))return Promise.resolve();
  return new Promise(function(res){
    if(window.Telegram&&window.Telegram.WebApp)return res();
    var s=document.createElement('script');s.src='https://telegram.org/js/telegram-web-app.js';s.onload=res;s.onerror=res;document.head.appendChild(s);setTimeout(res,2500);
  }).then(function(){
    var tg=window.Telegram&&window.Telegram.WebApp;if(!tg)return;
    App.tg=tg;App.tma=true;App.tgInit=tg.initData||'';
    try{tg.ready();tg.expand();tg.setHeaderColor('#082742');tg.setBackgroundColor('#F3F3F3');tg.BackButton.onClick(function(){history.back();});}catch(e){}
    if(window.ModusDisplay)window.ModusDisplay.start(tg);
    var sp=tg.initDataUnsafe&&tg.initDataUnsafe.start_param;if(sp&&/^A-\d+$/.test(sp))location.hash='#/t/'+sp;
  });
}
function pickApi(){
  if(location.protocol==='file:'||window.MODUS_STATIC_DEMO===true)return Promise.resolve(new LocalApi());
  var ctl=typeof AbortController!=='undefined'?new AbortController():null;
  var to=setTimeout(function(){if(ctl)ctl.abort();},8000);
  return fetch('/api/health',{credentials:'same-origin',signal:ctl?ctl.signal:undefined}).then(function(r){
    if(!r.ok)throw new Error('Сервер недоступен');return r.json();
  }).then(function(j){if(!j||j.mode!=='server')throw new Error('Сервер не отвечает');return new ServerApi('',j);}).finally(function(){clearTimeout(to);});
}

  teamAdvance:function(el){el.disabled=true;App.api.teamAdvance(App.cur.id).then(rerender).catch(function(e){el.disabled=false;fail(e);});},
  teamSchedule:function(){var t=App.cur,g=t.team;modal('<h2>Сроки командного решения</h2><label class="f" for="teamCollect">Предложения до</label><input class="inp" id="teamCollect" type="datetime-local" required '+(g.phase==='vote'?'disabled ':'')+'value="'+localInput(g.collectUntil)+'"><label class="f" for="teamVote">Голосование до</label><input class="inp" id="teamVote" type="datetime-local" required value="'+localInput(g.voteUntil)+'"><label class="f" for="teamResolve">Решить проблему до</label><input class="inp" id="teamResolve" type="datetime-local" required value="'+localInput(t.resolveDue)+'"><p class="help">Даты назначает руководитель. Срок решения должен быть позже окончания голосования.</p><button class="btn red" data-act="teamScheduleGo">Сохранить сроки</button>');},
  teamScheduleGo:function(el){var a=$('#teamCollect'),b=$('#teamVote'),c=$('#teamResolve');if(!a.reportValidity()||!b.reportValidity()||!c.reportValidity())return;el.disabled=true;App.api.teamDeadlines(App.cur.id,{collectUntil:new Date(a.value).toISOString(),voteUntil:new Date(b.value).toISOString(),resolveDue:new Date(c.value).toISOString()}).then(function(){closeModal();return rerender();}).catch(function(e){el.disabled=false;fail(e);});},
  personalAi:function(el){var ticket=el.dataset.ticket||null;App.ui.personalAi={ticketId:ticket,history:[],ownerId:App.me.id};modal('<h2>Мой ИИ-помощник</h2><p class="muted">Помогу разобраться в проблеме, сравнить варианты и сформулировать предложение. Решение принимает команда.</p><div id="personalLog" class="asklog"></div><label class="f" for="personalQuestion">Ваш вопрос</label><textarea class="inp" id="personalQuestion" maxlength="3000" placeholder="Опишите задачу и что уже пробовали"></textarea><button class="btn red" data-act="personalAsk">Спросить помощника</button><p class="help">'+(isDemoMode()?'В демо используется учебный ответ. DeepSeek подключается на сервере.':'Вопрос и доступный контекст этой карточки отправляются в DeepSeek.')+'</p>');},
  personalAsk:function(el){var a=App.ui.personalAi,q=$('#personalQuestion').value.trim();if(!q||!a||a.ownerId!==App.me.id)return;el.disabled=true;var payload={question:q,ticketId:a.ticketId,history:a.history.slice(-8).map(function(m){return {role:m.role,content:m.content.slice(0,3000)};})};var request=isDemoMode()?Promise.resolve({text:'Учебный ответ: уточните, когда возникает проблема и какой результат нужен. Предложите конкретное действие, ответственного и способ проверить эффект. В рабочей версии здесь отвечает DeepSeek.'}):fetch('/api/assistant/ask',{method:'POST',credentials:'same-origin',headers:Object.assign({'Content-Type':'application/json'},sessionHeaders()),body:JSON.stringify(payload)}).then(function(r){return r.json().then(function(x){if(!r.ok)throw new Error(x.error||'Не удалось получить ответ');return x;});});request.then(function(r){if(App.me.id!==a.ownerId)return;a.history.push({role:'user',content:q},{role:'assistant',content:r.text});var log=$('#personalLog');if(log)log.innerHTML=a.history.map(function(m){return '<div class="ab '+(m.role==='user'?'me':'ai')+'" style="white-space:pre-wrap">'+esc(m.content)+'</div>';}).join('');}).catch(fail).finally(function(){el.disabled=false;});},
  ownerPdf:function(el){el.disabled=true;fetch('/api/owner/reports/'+encodeURIComponent(el.dataset.v)+'/pdf',{credentials:'same-origin',headers:sessionHeaders()}).then(function(r){if(!r.ok)throw new Error('Не удалось скачать PDF');return r.blob();}).then(function(b){var url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='modus-report.pdf';a.click();setTimeout(function(){URL.revokeObjectURL(url);},10000);}).catch(fail).finally(function(){el.disabled=false;});}
});
var originalMore=viewMore;viewMore=function(){return Promise.resolve(originalMore()).then(function(h){return '<div class="card" style="margin-bottom:16px"><h2>Личный помощник</h2><p>Подскажет, как описать проблему и найти решение.</p><button class="btn navy" data-act="personalAi">Спросить ИИ</button></div>'+h;});};
var originalTicket=viewTicket;viewTicket=function(id){return originalTicket(id).then(function(h){return '<button class="btn line" style="margin-bottom:16px" data-act="personalAi" data-ticket="'+esc(id)+'">Помощь ИИ по этой проблеме</button>'+h;});};
var originalOwner=viewOwner;viewOwner=function(){if(App.me.role!=='owner')return originalOwner();return Promise.all([App.api.reports(),App.api.redemptions()]).then(function(r){var reports=r[0],cards=reports.map(function(x){return '<section class="card" style="margin-bottom:16px"><div class="row between"><h2>Отчёт за '+esc(x.day||'')+'</h2>'+(x.kind==='owner-daily'&&!isDemoMode()?'<button class="btn line" data-act="ownerPdf" data-v="'+esc(x.id)+'">Скачать PDF</button>':'')+'</div><p class="muted">'+(x.aiStatus==='ready'?'С анализом DeepSeek':'Факты из приложения')+' · сформирован '+fmt(x.at)+'</p><div style="white-space:pre-wrap">'+esc(x.text)+'</div></section>';}).join('');return '<div class="pagehead"><div><div class="eyebrow">Кабинет собственника</div><h1>Как команда решает проблемы</h1><p>Ежедневный отчёт за предыдущий день · 09:00, Павлодар (UTC+5).</p></div><button class="btn red" data-act="genReport">Сформировать отчёт</button></div>'+(cards||'<div class="card">Первый отчёт появится после формирования.</div>')+redemptionCard(r[1]);});};
acts.genReport=function(el){el.disabled=true;App.api.ownerReport().then(rerender).catch(fail).finally(function(){el.disabled=false;});};

start();
})();
</script>
</body>
</html>
